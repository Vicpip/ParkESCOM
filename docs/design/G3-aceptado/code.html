<img class="w-full h-full object-cover" data-alt="Silver Nissan Versa sedan front quarter view parked in a bright sunny parking checkpoint, clear license plate area, crisp daylight automotive documentation photography" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC3xq7ndOF-BIT9ofuEEpGX0FiwjGnXEF-dr4V1_VJWsC2E4DZk0XhbB61tEvqgS6kJm1hEH4kCyWRqfeyGmPDqCbbc87sNHlyiS4RrXIJ5zXh1W9GrFooKRUr2UDnBc6Mk6UU-qa0RrAXRFy-4to3mTG-EuYc9-fMY_V4PtCZNzTCH43k8nzbJTeqSc_EiOwaWEt5ZqFD7LdhE7LTAQO0LM1NMgTGHqHFy4MJhv3FFUhgScnWIA8G_"/>

</div>

<span class="font-label-md text-label-md text-on-surface-variant uppercase font-semibold">Tipo</span>
<span class="font-body-lg text-[15px] text-primary font-bold">Automóvil particular</span>
</div>
</div>
</div>
<!-- Temporizador y control de cierre táctil masivo -->
<div class="w-full bg-surface-container-lowest rounded-xl p-space-sm shadow-sm flex flex-col gap-space-sm border border-outline-variant/30">
<div class="flex items-center justify-between px-space-xs">
<div class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-[20px] text-[#059669]">timer</span>
<span class="font-label-lg text-label-lg text-on-surface font-bold" id="countdown-label">
        Se cierra en <span id="seconds-left">3</span> s
      </span>
</div>
<span class="font-label-md text-label-md text-[#059669] font-bold">Paso autorizado</span>
</div>
<div class="w-full h-2 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-[#059669] w-full transition-all ease-linear" id="countdown-bar" style="transition-duration: 3000ms; width: 0%;"></div>
</div>
<button class="w-full min-h-[48px] h-12 bg-primary active:bg-[#003857] text-[#ffffff] font-label-lg text-label-lg font-bold rounded-lg flex items-center justify-center gap-space-xs transition-colors shadow-sm" id="btn-close" onclick="handleClose()" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
<span>Cerrar</span>
</button>
</div></div>
<script>
  let secondsRemaining = 3;
  const secondsEl = document.getElementById('seconds-left');
  const barEl = document.getElementById('countdown-bar');

  requestAnimationFrame(() => {
    if (barEl) {
      barEl.style.width = '0%';
    }
  });

  const interval = setInterval(() => {
    secondsRemaining -= 1;
    if (secondsEl && secondsRemaining >= 0) {
      secondsEl.textContent = secondsRemaining;
    }
    if (secondsRemaining <= 0) {
      clearInterval(interval);
      handleClose();
    }
  }, 1000);

  function handleClose() {
    clearInterval(interval);
    if (window.history.length > 1) {
      window.history.back();
    } else {
      const container = document.getElementById('countdown-label');
      if (container) {
        container.textContent = 'Ventana lista para siguiente vehículo';
      }
    }
  }
</script></main></body></html>
